<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 빵빵! 귀여운 실시간 버스 알리미</title>
    
    <!-- 팝콘체 & Pretendard 폰트 -->
    <style>
        @font-face {
            font-family: 'ONE-Mobile-POP';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/ONE-Mobile-POP.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --pop-font: 'ONE-Mobile-POP', cursive, sans-serif;
            --main-font: 'Pretendard', sans-serif;
            --primary: #FFB800;
            --primary-dark: #E6A100;
            --accent-blue: #3B82F6;
            --accent-green: #10B981;
            --accent-pink: #FF6B81;
            --bg-color: #FFFDF0;
            --card-bg: #FFFFFF;
            --border-radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--main-font);
            color: #2D3748;
            padding: 18px;
        }

        /* App Header */
        .app-header {
            background: linear-gradient(135deg, #FFD54F, #FFB300);
            border-radius: var(--border-radius);
            padding: 20px 28px;
            box-shadow: 0 10px 25px rgba(255, 179, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 4px solid #FFF;
        }

        .header-title {
            font-family: var(--pop-font);
            font-size: 2.3rem;
            color: #4A2800;
            text-shadow: 2px 2px 0px #FFF;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-subtitle {
            font-size: 1rem;
            color: #5D4037;
            font-weight: 700;
            margin-top: 4px;
        }

        /* 2-Column Split Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 410px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* Card Panels */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 22px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border: 3px solid #FFE082;
            margin-bottom: 18px;
        }

        .card-title {
            font-family: var(--pop-font);
            font-size: 1.35rem;
            color: #3E2723;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Input Controls */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 800;
            color: #4A5568;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #FFE082;
            border-radius: 14px;
            font-size: 0.98rem;
            outline: none;
            background-color: #FFFDF7;
            font-family: var(--main-font);
            font-weight: 700;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-dark);
            background-color: #FFF;
            box-shadow: 0 0 0 3px rgba(255, 184, 0, 0.25);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Pin Selection Mode Buttons */
        .map-pin-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            background: #FFF8E1;
            padding: 8px;
            border-radius: 16px;
            border: 2px dashed #FFE082;
        }

        .pin-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            border-radius: 12px;
            font-family: var(--pop-font);
            font-size: 0.92rem;
            cursor: pointer;
            background: transparent;
            color: #5D4037;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .pin-btn.active {
            background: var(--primary);
            color: #3E2723;
            box-shadow: 0 4px 12px rgba(255, 184, 0, 0.4);
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #FFB800, #FF9800);
            color: #3E2723;
            font-family: var(--pop-font);
            font-size: 1.3rem;
            padding: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 152, 0, 0.35);
            margin-top: 10px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 152, 0, 0.45);
        }

        /* MAP CONTAINER & OVERLAYS */
        .map-container {
            background: #FFF;
            border-radius: var(--border-radius);
            padding: 20px;
            border: 3px solid #FFE082;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            position: sticky;
            top: 18px;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .map-title {
            font-family: var(--pop-font);
            font-size: 1.45rem;
            color: #3E2723;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-window {
            position: relative;
            width: 100%;
            height: 540px;
            background: #EBF8FF;
            border-radius: 18px;
            border: 3px solid #CBD5E0;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Live Floating Badge on Map Header */
        .map-status-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(6px);
            padding: 14px 20px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            border: 2px solid #FFF8E1;
        }

        .status-badge {
            font-family: var(--pop-font);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge.safe { color: #059669; }
        .status-badge.warning { color: #D97706; }
        .status-badge.danger { color: #DC2626; }

        .route-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .route-card {
            background: #FFFDF0;
            border: 2px solid #FFE082;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .route-card.top {
            border-color: #FFB800;
            background: #FFF8E1;
        }
    </style>
</head>
<body>

<!-- APP HEADER -->
<div class="app-header">
    <div>
        <div class="header-title">🚌 빵빵! 실시간 버스 지도 알리미</div>
        <div class="header-subtitle">지도를 자유롭게 클릭하고, 귀엽게 덜컹이며 달리는 실시간 버스를 확인하세요!</div>
    </div>
    <div style="font-size:3rem; filter: drop-shadow(2px 4px 0px rgba(0,0,0,0.1));">🗺️</div>
</div>

<div class="dashboard">

    <!-- LEFT CONTROLS -->
    <div class="left-panel">
        
        <!-- STEP 1: 위치 설정 -->
        <div class="card">
            <div class="card-title">📍 출발지 / 정류장 / 학원 설정</div>
            
            <div class="form-group">
                <label>📍 출발 위치 (내 위치)</label>
                <input type="text" id="startLocName" class="form-control" value="역삼동 (지도에서 선택 가능)">
            </div>

            <div class="form-group">
                <label>🚏 버스 탑승 정류장</label>
                <input type="text" id="stopLocName" class="form-control" value="한티역 2번 출구 정류장">
            </div>

            <div class="form-group">
                <label>🏫 목적지 (학원)</label>
                <input type="text" id="academyName" class="form-control" value="대치 명문 수학학원">
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label>🚌 버스 번호</label>
                    <input type="text" id="busNum" class="form-control" value="340번">
                </div>
                <div class="form-group">
                    <label>⏰ 도착 목표 시간</label>
                    <input type="time" id="classTime" class="form-control" value="18:00">
                </div>
            </div>
        </div>

        <!-- STEP 2: 환경 설정 및 AI 분석 -->
        <div class="card">
            <div class="card-title">🌤️ 날씨 & 걸음 속도 설정</div>

            <div class="input-row">
                <div class="form-group">
                    <label>🌦️ 날씨 상태</label>
                    <select id="weatherSelect" class="form-control" onchange="recalculate()">
                        <option value="clear">☀️ 맑음 (정체 없음)</option>
                        <option value="rain">🌧️ 비 옴 (+3분 정체)</option>
                        <option value="snow">❄️ 눈 옴 (+6분 정체)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🏃 내 걸음 속도</label>
                    <select id="speedSelect" class="form-control" onchange="recalculate()">
                        <option value="normal">🏃 보통 걸음</option>
                        <option value="fast">⚡ 파워 워킹</option>
                        <option value="slow">🚶 느긋한 걸음</option>
                    </select>
                </div>
            </div>

            <button class="btn-main" onclick="recalculate()">🔄 실시간 위치 & 분석 업데이트</button>
        </div>

        <!-- STEP 3: 놓쳤을 때 대안 경로 -->
        <div class="card">
            <div class="card-title">🚨 버스 놓침 대비 대안 수단</div>
            <div class="route-grid" id="routeList"></div>
        </div>

    </div>

    <!-- RIGHT PANEL: LARGE MAP WITH ANIMATED BUS -->
    <div class="map-container">
        <div class="map-header">
            <div class="map-title">🗺️ 대형 인터랙티브 라이브 지도</div>
            <span style="font-size:0.85rem; color:#718096; font-weight:700;">💡 지도를 클릭하면 핀이 이동합니다</span>
        </div>

        <!-- Map Mode Selector -->
        <div class="map-pin-selector">
            <button class="pin-btn active" id="btnPinStart" onclick="setSelectMode('start')">📍 출발지 찍기</button>
            <button class="pin-btn" id="btnPinStop" onclick="setSelectMode('stop')">🚏 정류장 찍기</button>
            <button class="pin-btn" id="btnPinAcademy" onclick="setSelectMode('academy')">🏫 학원 찍기</button>
        </div>

        <!-- Map Window Canvas -->
        <div class="map-window">
            <div class="map-status-overlay">
                <div>
                    <div class="status-badge safe" id="mapStatusTitle">🟢 여유 있음</div>
                    <div id="mapStatusDesc" style="font-size:0.88rem; color:#4A5568; margin-top:2px;">
                        버스가 곧 도착합니다. 여유있게 이동하세요!
                    </div>
                </div>
                <div id="mapStatusTime" style="font-size:1.5rem; font-family:var(--pop-font); color:#2D3748;">
                    여유 +2분
                </div>
            </div>

            <canvas id="mapCanvas" width="850" height="540"></canvas>
        </div>

        <div style="font-size:0.85rem; color:#718096; text-align:center; margin-top:10px; font-weight:600;">
            🔵 파란 점선: 도보 경로(움직이는 아홉 점) | 🟡 노란 대로: 버스 주행 도로 | 💨 연기 뿜는 버스: 실시간 위치
        </div>
    </div>

</div>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

let selectMode = 'start';

// Locations in Canvas Coordinates
let pins = {
    start: { x: 200, y: 380 },
    stop: { x: 280, y: 220 },
    academy: { x: 700, y: 220 }
};

// Animated Bus & Line Variables
let busX = 60;              // Current Bus position on screen
let targetBusX = 60;        // Target position calculated by ETA
let dashOffset = 0;         // Animated dashed walking line offset
let smokeParticles = [];    // Cute exhaust smoke particles

function setSelectMode(mode) {
    selectMode = mode;
    document.getElementById('btnPinStart').classList.toggle('active', mode === 'start');
    document.getElementById('btnPinStop').classList.toggle('active', mode === 'stop');
    document.getElementById('btnPinAcademy').classList.toggle('active', mode === 'academy');
}

// Map Click Listener
canvas.addEventListener('click', function(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const mouseX = (evt.clientX - rect.left) * scaleX;
    const mouseY = (evt.clientY - rect.top) * scaleY;

    if (selectMode === 'start') {
        pins.start.x = mouseX;
        pins.start.y = mouseY;
        document.getElementById('startLocName').value = `선택 지점 (${Math.round(mouseX)}, ${Math.round(mouseY)})`;
    } else if (selectMode === 'stop') {
        pins.stop.x = mouseX;
        pins.stop.y = mouseY;
        pins.academy.y = mouseY; // Align road line
        document.getElementById('stopLocName').value = `선택 정류장 (${Math.round(mouseX)}, ${Math.round(mouseY)})`;
    } else if (selectMode === 'academy') {
        pins.academy.x = mouseX;
        pins.academy.y = mouseY;
        document.getElementById('academyName').value = `선택 학원 (${Math.round(mouseX)}, ${Math.round(mouseY)})`;
    }

    recalculate();
});

// MAIN ANIMATION LOOP (RequestAnimationFrame for super smooth motion)
function renderLoop() {
    // 1. Update Animations
    dashOffset -= 0.6; // Walking path dash moving effect
    
    // Smooth Lerp movement for the bus towards target position
    busX += (targetBusX - busX) * 0.04;

    // Generate cute exhaust smoke particle behind the bus
    if (Math.random() < 0.3) {
        smokeParticles.push({
            x: busX - 22,
            y: pins.stop.y + (Math.random() * 6 - 3),
            radius: 3 + Math.random() * 4,
            alpha: 0.7,
            dy: -0.4 - Math.random() * 0.4
        });
    }

    // Update smoke particles
    smokeParticles.forEach((p, idx) => {
        p.y += p.dy;
        p.x -= 0.5; // Drift backward slightly
        p.alpha -= 0.015;
        p.radius += 0.15;
        if (p.alpha <= 0) smokeParticles.splice(idx, 1);
    });

    // 2. Draw Everything
    drawMap();

    requestAnimationFrame(renderLoop);
}

function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- Background Map Elements ---
    ctx.fillStyle = "#F4F7F6";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Green Park Area (Cute Decor)
    ctx.fillStyle = "#E6F4EA";
    ctx.beginPath();
    ctx.roundRect(40, 40, 180, 120, 20);
    ctx.roundRect(500, 320, 280, 160, 24);
    ctx.fill();

    ctx.font = "20px Pretendard";
    ctx.fillText("🌳", 80, 90);
    ctx.fillText("🌲", 140, 110);
    ctx.fillText("🌲", 550, 390);
    ctx.fillText("🌸", 640, 420);

    // River / Stream (Cute Blue Curved Ribbon)
    ctx.strokeStyle = "#C3E8FF";
    ctx.lineWidth = 28;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 480);
    ctx.bezierCurveTo(300, 500, 400, 380, 850, 460);
    ctx.stroke();

    // Secondary Cross Roads
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(pins.start.x, 0);
    ctx.lineTo(pins.start.x, canvas.height);
    ctx.stroke();

    // MAIN BUS HIGHWAY (Yellow Road)
    ctx.strokeStyle = "#FFE082";
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.moveTo(20, pins.stop.y);
    ctx.lineTo(830, pins.stop.y);
    ctx.stroke();

    // Road Center Dash Lines
    ctx.strokeStyle = "#FFB800";
    ctx.lineWidth = 3;
    ctx.setLineDash([14, 12]);
    ctx.beginPath();
    ctx.moveTo(20, pins.stop.y);
    ctx.lineTo(830, pins.stop.y);
    ctx.stroke();
    ctx.setLineDash([]); // Reset line dash

    // --- MOVING PEDESTRIAN PATH (Blue Animated Dashed Line) ---
    ctx.strokeStyle = "#3B82F6";
    ctx.lineWidth = 5;
    ctx.setLineDash([8, 8]);
    ctx.lineDashOffset = dashOffset;
    ctx.beginPath();
    ctx.moveTo(pins.start.x, pins.start.y);
    ctx.lineTo(pins.stop.x, pins.stop.y);
    ctx.stroke();
    ctx.setLineDash([]); // Reset dash

    // --- DRAW MAP PINS ---
    // Start Pin (내 위치)
    drawPinBadge(pins.start.x, pins.start.y, "#3B82F6", "🏃", "내 위치");

    // Bus Stop Pin (정류장)
    drawPinBadge(pins.stop.x, pins.stop.y, "#FF9800", "🚏", "정류장");

    // Academy Pin (목적지)
    drawPinBadge(pins.academy.x, pins.academy.y, "#10B981", "🏫", document.getElementById('academyName').value);

    // --- EXHAUST SMOKE PARTICLES ---
    smokeParticles.forEach(p => {
        ctx.fillStyle = `rgba(200, 210, 220, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // --- SUPER CUTE MOVING BUS WITH ENGINE BOUNCE ---
    const bounceY = Math.sin(Date.now() / 120) * 3; // Engine wobble vibration
    const busY = pins.stop.y + bounceY;

    drawCuteBus(busX, busY);
}

// Draw Super Cute Vector Bus
function drawCuteBus(x, y) {
    const busWidth = 52;
    const busHeight = 32;

    ctx.save();
    ctx.translate(x, y);

    // Bus Body (Cute Rounded Yellow Box)
    ctx.fillStyle = "#FFB800";
    ctx.beginPath();
    ctx.roundRect(-busWidth/2, -busHeight/2 - 6, busWidth, busHeight, 10);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#E6A100";
    ctx.stroke();

    // Bus Roof Cap Light
    ctx.fillStyle = "#EF4444";
    ctx.beginPath();
    ctx.arc(0, -busHeight/2 - 7, 4, 0, Math.PI * 2);
    ctx.fill();

    // Windows (Blue Tinted)
    ctx.fillStyle = "#E0F2FE";
    ctx.beginPath();
    ctx.roundRect(-busWidth/2 + 6, -busHeight/2 - 2, 12, 12, 3);
    ctx.roundRect(-busWidth/2 + 22, -busHeight/2 - 2, 12, 12, 3);
    ctx.roundRect(-busWidth/2 + 38, -busHeight/2 - 2, 8, 12, 3);
    ctx.fill();

    // Cute Eyes / Headlight on Front Window
    ctx.fillStyle = "#1E293B";
    ctx.beginPath();
    ctx.arc(-busWidth/2 + 10, -busHeight/2 + 4, 2, 0, Math.PI * 2);
    ctx.arc(-busWidth/2 + 26, -busHeight/2 + 4, 2, 0, Math.PI * 2);
    ctx.fill();

    // Wheels (Black Spinning circles)
    const wheelAngle = (x / 10) % (Math.PI * 2);
    ctx.fillStyle = "#334155";
    ctx.beginPath();
    ctx.arc(-16, busHeight/2 - 4, 6, 0, Math.PI * 2);
    ctx.arc(16, busHeight/2 - 4, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#FFF";
    ctx.beginPath();
    ctx.arc(-16, busHeight/2 - 4, 2, 0, Math.PI * 2);
    ctx.arc(16, busHeight/2 - 4, 2, 0, Math.PI * 2);
    ctx.fill();

    // Bus Label Badge
    ctx.font = "bold 11px Pretendard";
    ctx.fillStyle = "#1E293B";
    ctx.textAlign = "center";
    const busNumStr = document.getElementById('busNum').value;
    ctx.fillText(`🚌 ${busNumStr}`, 0, -busHeight/2 - 14);

    ctx.restore();
}

// Draw Map Location Pin
function drawPinBadge(x, y, color, emoji, label) {
    ctx.save();
    
    // Outer Pin Glow
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.fill();

    // Emoji Icon
    ctx.font = "16px Pretendard";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, x, y);

    // Label Pill
    ctx.font = "bold 12px Pretendard";
    ctx.fillStyle = "#1E293B";
    ctx.beginPath();
    ctx.roundRect(x - 45, y + 22, 90, 22, 8);
    ctx.fill();

    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(label.length > 7 ? label.substring(0,6)+'..' : label, x, y + 33);

    ctx.restore();
}

// Recalculate ETA and Bus Position Target
function recalculate() {
    const dx = pins.stop.x - pins.start.x;
    const dy = pins.stop.y - pins.start.y;
    const distancePx = Math.sqrt(dx*dx + dy*dy);
    
    const speedVal = document.getElementById('speedSelect').value;
    let speedMult = 1.0;
    if (speedVal === 'fast') speedMult = 0.8;
    if (speedVal === 'slow') speedMult = 1.35;

    const walkMin = Math.max(Math.round((distancePx / 42) * speedMult), 1);

    const weather = document.getElementById('weatherSelect').value;
    let trafficDelay = 2;
    if (weather === 'rain') trafficDelay = 5;
    if (weather === 'snow') trafficDelay = 8;

    const busEta = Math.max(3 + Math.floor(trafficDelay * 0.5), 2);
    const timeDiff = busEta - walkMin;

    // Calculate dynamic bus target position on map (x axis)
    targetBusX = pins.stop.x - (busEta * 45);
    if (targetBusX < 50) targetBusX = 50;

    // Update Overlay UI
    const statusTitle = document.getElementById('mapStatusTitle');
    const statusDesc = document.getElementById('mapStatusDesc');
    const statusTime = document.getElementById('mapStatusTime');

    if (timeDiff >= 2) {
        statusTitle.className = "status-badge safe";
        statusTitle.innerHTML = "🟢 여유 있음 (안전 출발)";
        statusDesc.innerText = `버스가 ${busEta}분 후 도착 예정입니다. 정류장까지 도보 약 ${walkMin}분 소요됩니다.`;
        statusTime.innerText = `여유 +${timeDiff}분`;
        statusTime.style.color = "#059669";
    } else if (timeDiff >= -1) {
        statusTitle.className = "status-badge warning";
        statusTitle.innerHTML = "🏃‍♂️ 서두르세요! (지금 출발)";
        statusDesc.innerText = `버스가 ${busEta}분 후도착합니다! 지금 즉시 빠르기로 걸어가세요.`;
        statusTime.innerText = `서두르세요!`;
        statusTime.style.color = "#D97706";
    } else {
        statusTitle.className = "status-badge danger";
        statusTitle.innerHTML = "🚨 놓칠 위험! (대안 추천)";
        statusDesc.innerText = `정류장 도보 소요시간(${walkMin}분)이 버스 도착시간(${busEta}분)보다 길어 놓칠 수 있습니다!`;
        statusTime.innerText = `지각 위험`;
        statusTime.style.color = "#DC2626";
    }

    renderRoutes(trafficDelay);
}

function renderRoutes(trafficFactor) {
    const container = document.getElementById('routeList');
    container.innerHTML = '';

    const routes = [
        { name: "⚡ 따릉이/킥보드", time: 7 + trafficFactor, score: 96 },
        { name: "🚇 지하철 이용", time: 11, score: 88 },
        { name: "🏃‍♂️ 전력 질주", time: 13, score: 75 },
        { name: "🚕 택시 호출", time: 6 + (trafficFactor * 2), score: 62 }
    ];

    routes.forEach((r, i) => {
        const div = document.createElement('div');
        div.className = `route-card ${i===0?'top':''}`;
        div.innerHTML = `
            <div>
                <strong style="font-size:0.95rem; color:#2D3748;">${i+1}. ${r.name}</strong>
                <div style="font-size:0.8rem; color:#718096;">약 ${r.time}분 소요</div>
            </div>
            <span style="font-family:var(--pop-font); color:#D69E2E; font-size:1.1rem;">${r.score}점</span>
        `;
        container.appendChild(div);
    });
}

// Start Main Animation Engine
window.onload = function() {
    recalculate();
    renderLoop();
};
</script>

</body>
</html>
